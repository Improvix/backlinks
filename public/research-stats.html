<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>Статистика обработки ссылок</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-dark text-light p-4">
  <div class="container">
    <h2 class="mb-4">📊 Статистика обработки ссылок</h2>

    <table class="table table-hover table-dark table-bordered">
      <thead>
        <tr>
          <th>Email пользователя</th>
          <th>Всего ссылок</th>
          <th>Обработано вчера</th>
          <th>Обработано сегодня</th>
          <th>Обработано всего</th>
        </tr>
      </thead>
      <tbody id="statsTableBody"></tbody>
    </table>
  </div>

  <script>
    async function loadStats() {
      const res = await fetch('/api/research-stats');
      const stats = await res.json();

      const tbody = document.getElementById('statsTableBody');
      tbody.innerHTML = '';

      stats.forEach(user => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${user.email}</td>
          <td>${user.total}</td>
          <td>${user.doneYesterday}</td>
          <td>${user.doneToday}</td>
          <td>${user.doneTotal}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    loadStats();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
